name: API Docs Check

on:
  pull_request:
    paths:
      - 'puptas/app/Http/Controllers/**'
      - 'puptas/routes/api.php'
      - 'puptas/config/scribe.php'
      - 'puptas/.scribe/**'

jobs:
  scribe-dry-run:
    name: Scribe generate (dry run)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: puptas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, zip, mbstring, exif, pcntl, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        working-directory: puptas
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        working-directory: puptas
        run: cp .env.example .env

      - name: Set environment for CI
        working-directory: puptas
        run: |
          php artisan key:generate
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=puptas_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "APP_URL=http://localhost" >> .env

      - name: Run migrations
        working-directory: puptas
        run: php artisan migrate --force

      - name: Run Scribe (no response calls — dry run)
        working-directory: puptas
        run: php artisan scribe:generate

      - name: Verify OpenAPI spec was generated
        working-directory: puptas
        run: |
          test -f storage/app/scribe/openapi.yaml || { echo "openapi.yaml not found"; exit 1; }
          echo "openapi.yaml generated successfully"

      - name: Convert OpenAPI YAML to JSON
        working-directory: puptas
        run: php artisan scribe:openapi-to-json --input=storage/app/scribe/openapi.yaml --output=storage/app/scribe/openapi.json
