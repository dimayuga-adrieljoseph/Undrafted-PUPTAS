  /api/v1/webhooks/medical-result:
    post:
      summary: 'Receive a medical result webhook'
      operationId: receiveAMedicalResultWebhook
      description: "Secure webhook for external medical partners to push a student's medical\nclearance result into PUPTAS. The payload is queued and processed\nasynchronously.\n\n## Security requirements\nThis endpoint enforces **two** layers of security:\n\n1. **OAuth client credentials scope** — `client:medical-write`\n   The caller must present a Passport client-credentials access token\n   granted the `medical-write` scope via the `Authorization: Bearer` header.\n\n2. **Custom SHA256 HMAC signature** — `X-Medical-Signature` header\n   The caller computes `hash_hmac('sha256', <raw JSON body>, <shared secret>)`\n   using the secret configured at `services.medical_webhook.secret`, and\n   sends the hex digest in the `X-Medical-Signature` header. This verifies\n   payload authenticity and integrity.\n\n### Replay protection\nThe JSON body must also include:\n- `timestamp`: ISO8601 string or UNIX epoch seconds, within 5 minutes of now.\n- `nonce`: a unique value; repeated nonces are rejected for 10 minutes."
      parameters:
        -
          in: header
          name: X-Medical-Signature
          description: ''
          example: 'string required SHA256 HMAC hex digest of the raw JSON body using `services.medical_webhook.secret`. Example: 5f4dcc3b5aa765d61d8327deb882cf99'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Medical webhook received and queued for processing'
                properties:
                  message:
                    type: string
                    example: 'Medical webhook received and queued for processing'
        403:
          description: 'Invalid signature'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid Signature'
                properties:
                  message:
                    type: string
                    example: 'Invalid Signature'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Validation failed'
                  errors:
                    is_health_profile_completed:
                      - 'The is health profile completed field is required.'
                properties:
                  message:
                    type: string
                    example: 'Validation failed'
                  errors:
                    type: object
                    properties:
                      is_health_profile_completed:
                        type: array
                        example:
                          - 'The is health profile completed field is required.'
                        items:
                          type: string
      tags:
        - 'Medical Webhooks'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference_number:
                  type: string
                  description: "The student's application reference number. Required if `idp_user_id` is absent."
                  example: T2026-000123
                  nullable: true
                idp_user_id:
                  type: string
                  description: "The student's IDP user UUID (also accepted as `student_id`). Required if `reference_number` is absent."
                  example: 8f9c6a9b-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                  nullable: true
                is_health_profile_completed:
                  type: integer
                  description: 'Whether the student completed their health profile (1 = cleared).'
                  example: 1
                timestamp:
                  type: string
                  description: 'ISO8601 timestamp or UNIX epoch seconds within the last 5 minutes.'
                  example: '1785240000'
                nonce:
                  type: string
                  description: 'Unique request nonce for replay protection.'
                  example: 7c9e6679-7425-40de-944b-e07f6e7e1c3b
              required:
                - is_health_profile_completed
                - timestamp
                - nonce
