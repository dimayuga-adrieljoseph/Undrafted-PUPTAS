                      reference_number: T2026-000123
                      salutation: null
                      firstname: Juan
                      middlename: Santos
                      extension_name: null
                      lastname: 'Dela Cruz'
                      sex: Male
                      email: juan.delacruz@example.com
                      date_graduated: '2025-05-30'
                      strand: STEM
                      track: Academic
                      application:
                        id: 456
