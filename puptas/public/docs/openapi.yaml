        -
          in: query
          name: per_page
          description: 'Number of results per page (1–100). Defaults to 15.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Number of results per page (1–100). Defaults to 15.'
            example: 15
        -
          in: query
          name: page
          description: 'Page number. Defaults to 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number. Defaults to 1.'
            example: 1
        -
          in: query
          name: program
          description: 'Filter by program code (e.g. BSIT).'
          example: null
          required: false
          schema:
            type: string
            description: 'Filter by program code (e.g. BSIT).'
            example: null
            nullable: true
