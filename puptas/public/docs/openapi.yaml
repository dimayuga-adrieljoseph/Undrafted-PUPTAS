openapi: 3.0.3
info:
  title: 'PUPTAS API Documentation'
  description: 'External integration API for the PUPTAS enrollment system. Provides Student, Program, and Medical endpoints for authorized external partners via Passport client credentials (OAuth2), plus a secure HMAC-signed medical webhook.'
  version: 1.0.0
servers:
  - url: 'http://127.0.0.1:8000'
tags:
  - name: 'Medical Integration'
    description: ''
  - name: 'Medical Webhooks'
    description: ''
  - name: 'Program Catalog'
    description: ''
  - name: 'Student Admission'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'All external API endpoints require a Passport client-credentials access token sent as a Bearer token. The medical webhook (POST /api/v1/webhooks/medical-result) additionally requires an HMAC `X-Medical-Signature` header (SHA256 of the raw JSON body using the shared `services.medical_webhook.secret`).'
security:
  -
    default: []
paths:
  /api/v1/medical/applicants:
